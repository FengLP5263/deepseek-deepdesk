appId: com.deepdesk.app
productName: DeepDesk
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
