name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Package target"
        type: choice
        required: true
        default: win
        options:
          - win
          - mac
          - all

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win
            os: windows-latest
          - target: mac
            os: macos-latest
    steps:
      - name: Verify release source
        run: >-
          node -e "const ref = process.env.GITHUB_REF || ''; if (ref !== 'refs/heads/main' && !ref.startsWith('refs/tags/v')) { console.error('Release workflow must run from main or a v* tag. Current ref: ' + ref); process.exit(1) }"

      - name: Skip non-selected target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'all' && inputs.target != matrix.target }}
        run: echo "Skipping ${{ matrix.target }}"

      - name: Checkout
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.target }}
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: ${{ github.event_name == 'push' }}
        run: >-
          node -e "const pkg = require('./package.json'); const expected = 'v' + pkg.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Release tag must match package.json: expected ' + expected + ', got ' + process.env.GITHUB_REF_NAME); process.exit(1) }"

      - name: Setup pnpm
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.target }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.target }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.target }}
        run: pnpm install --frozen-lockfile

      - name: Run release gate and package
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.target }}
        run: pnpm flow -- release --target ${{ matrix.target }}

      - name: Upload artifacts
        if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: deepdesk-${{ matrix.target }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
